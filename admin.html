<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin</title><style>body{font-family:Arial;margin:0;background:#f4f1ea;color:#191713}.wrap{max-width:1100px;margin:auto;padding:20px}.top,.panel{background:#fff;border:1px solid #ddd5c8;border-radius:16px;padding:18px;margin-bottom:14px}.top{background:#201c15;color:white;display:flex;justify-content:space-between}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tab,.btn{padding:10px 14px;border:0;border-radius:9px;font-weight:bold;cursor:pointer}.tab{background:#fff;border:1px solid #ddd}.active{background:#d8a94d!important}.panel{display:none}.panel.active{display:block}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}label{font-weight:bold;display:block;margin-bottom:5px}input,textarea,select{width:100%;box-sizing:border-box;padding:11px;border:1px solid #d5ccbd;border-radius:9px;font:inherit}textarea{min-height:90px}.btn{background:#29251e;color:#fff}.gold{background:#d8a94d;color:#17130c}.danger{background:#c74d3f}.hint{color:#777;font-size:13px;line-height:1.6}.pixel{border:1px solid #ddd5c8;border-radius:12px;padding:12px;margin:10px 0}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}@media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style><main class="wrap"><div class="top"><h2>لوحة تحكم المتجر</h2><a class="btn gold" href="./" target="_blank">فتح المتجر</a></div><div class="tabs"><button class="tab active" data-t="content">🎨 المحتوى</button><button class="tab" data-t="images">🖼️ الصور</button><button class="tab" data-t="pixels">📈 Meta Pixels</button><button class="tab" data-t="settings">⚙️ الربط</button><button class="tab" data-t="orders">📦 الطلبات</button></div><section id="content" class="panel active"><div class="grid"><div><label>اسم المنتج</label><input id="name"></div><div><label>السعر DT</label><input id="price" type="number"></div><div><label>التوصيل DT</label><input id="delivery" type="number"></div><div><label>اللون</label><input id="color" type="color"></div><div class="full"><label>العنوان الرئيسي</label><input id="headline"></div><div class="full"><label>الوصف</label><textarea id="description"></textarea></div></div><button class="btn gold" onclick="saveAll()">حفظ التغييرات</button><p id="msg"></p></section><section id="images" class="panel"><label>روابط الصور</label><div class="hint">حتى 6 صور. كل تغيير يتسجل.</div><div id="imgs"></div><button class="btn" onclick="addImg()">+ صورة</button> <button class="btn gold" onclick="saveAll()">حفظ</button></section><section id="pixels" class="panel"><h3>Meta Pixel Manager</h3><p class="hint">تنجم تضيف أكثر من Pixel. كل Pixel عندو ID وحالة تشغيل.</p><div id="px"></div><button class="btn" onclick="addPx()">+ إضافة Pixel</button> <button class="btn gold" onclick="saveAll()">حفظ الـPixels</button><p id="pxmsg"></p></section><section id="settings" class="panel"><label>Google Apps Script Web App URL</label><input id="api" placeholder="https://script.google.com/macros/s/.../exec"><label style="margin-top:10px">Admin Key</label><input id="key" type="password"><label style="margin-top:10px">Mode</label><select id="mode"><option value="api">API / Google Sheets</option><option value="local">Local</option></select><button class="btn gold" style="margin-top:12px" onclick="saveAll()">حفظ الربط</button><p class="hint">في API، التغييرات تتسجل في Config والطلبات في Orders.</p></section><section id="orders" class="panel"><button class="btn gold" onclick="loadOrders()">تحديث الطلبات</button><div id="ordersBox" style="overflow:auto;margin-top:12px"></div></section></main><script>const K='eshop_admin_v3';let d=JSON.parse(localStorage.getItem(K)||'null')||{content:{name:'6 Dessous de Plat en Bois',price:29,delivery:6,color:'#d8a94d',headline:'حماية لسطحك بأناقة طبيعية',description:'Pack de 6 pièces'},images:[],mainImage:0,pixels:[],settings:{api:'',key:'',mode:'api'},orders:[]};d.pixels=d.pixels||[];d.images=d.images||[];d.settings=d.settings||{api:'',key:'',mode:'api'};const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function localSave(){localStorage.setItem(K,JSON.stringify(d))}async function apiSave(){if(d.settings.mode!=='api'||!d.settings.api)return null;let r=await fetch(d.settings.api,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'saveConfig',key:d.settings.key,config:{...d.content,images:d.images,mainImage:d.mainImage,pixels:d.pixels}})});return r.json()}async function saveAll(){d.content={name:$('name').value,price:+$('price').value,delivery:+$('delivery').value,color:$('color').value,headline:$('headline').value,description:$('description').value};d.settings={api:$('api').value.trim(),key:$('key').value,mode:$('mode').value};localSave();try{await apiSave();$('msg').textContent='✅ تسجّل التغيير محلياً وعلى السيرفر.'}catch(e){$('msg').textContent='⚠️ تسجّل محلياً، أما السيرفر ما جاوبش.'}}function fields(){Object.entries({name:d.content.name,price:d.content.price,delivery:d.content.delivery,color:d.content.color,headline:d.content.headline,description:d.content.description,api:d.settings.api,key:d.settings.key,mode:d.settings.mode}).forEach(([k,v])=>$(k).value=v||'')}function renderImgs(){let b=$('imgs');b.innerHTML='';d.images.forEach((u,i)=>{let x=document.createElement('div');x.className='row';x.style.margin='8px 0';x.innerHTML='<input value="'+esc(u)+'" style="flex:1"><button class="btn danger">حذف</button>';x.querySelector('input').oninput=e=>{d.images[i]=e.target.value;localSave()};x.querySelector('button').onclick=()=>{d.images.splice(i,1);localSave();renderImgs()};b.appendChild(x)})}function addImg(){if(d.images.length<6){d.images.push('');localSave();renderImgs()}}function renderPx(){let b=$('px');b.innerHTML='';d.pixels.forEach((p,i)=>{let x=document.createElement('div');x.className='pixel';x.innerHTML='<div class="grid"><div><label>اسم Pixel</label><input value="'+esc(p.name||'')+'"></div><div><label>Pixel ID</label><input value="'+esc(p.id||'')+'"></div><label><input type="checkbox" '+(p.enabled!==false?'checked':'')+'> مفعّل</label><button class="btn danger">حذف</button></div>';let a=x.querySelectorAll('input');a[0].oninput=e=>{p.name=e.target.value;localSave()};a[1].oninput=e=>{p.id=e.target.value.replace(/\D/g,'');localSave()};a[2].onchange=e=>{p.enabled=e.target.checked;localSave()};x.querySelector('button').onclick=()=>{d.pixels.splice(i,1);localSave();renderPx()};b.appendChild(x)})}function addPx(){d.pixels.push({name:'Pixel '+(d.pixels.length+1),id:'',enabled:true});localSave();renderPx()}async function loadOrders(){if(d.settings.mode==='api'&&d.settings.api){try{let r=await fetch(d.settings.api+'?action=orders&key='+encodeURIComponent(d.settings.key));let j=await r.json();if(Array.isArray(j.orders))d.orders=j.orders}catch(e){}}$('ordersBox').innerHTML='<table border="1" cellpadding="8" style="border-collapse:collapse;width:100%;min-width:700px"><tr><th>Date</th><th>Nom</th><th>Téléphone</th><th>Gouvernorat</th><th>Quantité</th><th>Total</th><th>Statut</th></tr>'+d.orders.map((o,i)=>'<tr><td>'+esc(o.date)+'</td><td>'+esc(o.name)+'</td><td>'+esc(o.phone)+'</td><td>'+esc(o.governorate)+'</td><td>'+esc(o.qty)+'</td><td>'+esc(o.total)+'</td><td><select onchange="setStatus('+i+',this.value)"><option value="new">جديدة</option><option value="confirmed">مؤكدة</option><option value="shipped">مرسلة</option><option value="cancelled">ملغاة</option></select></td></tr>').join('')+'</table>';d.orders.forEach((o,i)=>{let s=document.querySelectorAll('#ordersBox select')[i];if(s)s.value=o.status||'new'})}async function setStatus(i,v){d.orders[i].status=v;localSave();try{if(d.settings.mode==='api')await fetch(d.settings.api,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'status',key:d.settings.key,row:d.orders[i]})})}catch(e){}}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab,.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');$(b.dataset.t).classList.add('active')});fields();renderImgs();renderPx();loadOrders();</script>
